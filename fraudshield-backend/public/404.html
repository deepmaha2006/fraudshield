<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found — FraudShield</title>
  <!-- Absolute paths: the service worker may serve this page in place of any URL. No CDN/fonts: must work offline. -->
  <link rel="stylesheet" href="/css/not-found.css">
</head>
<body data-variant="notfound">
  <main class="nf-stage">
    <div class="nf-message" id="nf-message" role="alert" aria-live="polite">
      <div class="nf-title" id="nf-title">Page Not Found</div>
      <div class="nf-code" id="nf-code"></div>
      <div class="nf-text" id="nf-text"></div>
      <div class="nf-detail" id="nf-detail" hidden></div>
      <div class="nf-actions">
        <button type="button" class="nf-btn nf-btn-outline" id="nf-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          Go Back
        </button>
        <button type="button" class="nf-btn nf-btn-outline" id="nf-retry" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          Try Again
        </button>
        <button type="button" class="nf-btn nf-btn-solid" id="nf-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Go Home
        </button>
      </div>
    </div>
    <div class="nf-characters" id="nf-characters" aria-hidden="true"></div>
    <canvas class="nf-canvas" id="nf-canvas" aria-hidden="true"></canvas>
  </main>
  <script src="/js/not-found.js"></script>
</body>
</html>
