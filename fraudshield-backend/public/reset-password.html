<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · FraudShield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/light.css">
</head>
<body class="light">
  <main class="l-wrap" style="max-width:460px;padding-top:96px">
    <a class="row" href="/" style="color:inherit;text-decoration:none;gap:10px;margin-bottom:24px">
      <span data-icon="shield" class="brand-mark"></span><span class="brand-name">FraudShield</span>
    </a>
    <form class="panel panel-body stack" id="reset-form">
      <h2 style="font-size:20px">Choose a new password</h2>
      <p class="muted" style="margin:0;font-size:13px">Completing the reset signs out every active session on this account.</p>
      <div class="field"><label for="p1">New password</label><input class="input" id="p1" type="password" required minlength="8" autocomplete="new-password"><span class="hint">At least 8 characters.</span></div>
      <div class="field"><label for="p2">Confirm new password</label><input class="input" id="p2" type="password" required minlength="8" autocomplete="new-password"></div>
      <div class="callout danger hidden" id="error"></div>
      <div class="callout ok hidden" id="done"></div>
      <button class="btn btn-primary btn-lg" type="submit" id="submit">Update password</button>
    </form>
  </main>
  <script src="js/core.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
