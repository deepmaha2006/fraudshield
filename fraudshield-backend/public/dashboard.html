<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Dashboard · FraudShield SOC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/light.css">
</head>
<body class="light" data-page="overview">
  <main class="ld-page">
    <div class="ld-header">
      <h1>Dashboard</h1>
      <div class="ld-header-actions">
        <span class="ld-range" id="range" title="Period covered by the chart"><span data-icon="calendar"></span><span id="range-text">—</span></span>
        <a class="ld-primary" href="/analyzer.html"><span data-icon="search"></span>Investigate</a>
      </div>
    </div>

    <nav class="ld-tabs" aria-label="Dashboard sections">
      <a href="/dashboard.html" class="active" aria-current="page">Overview</a>
      <a href="/detections.html">Detections</a>
      <a href="/weekly-summary.html">Reports</a>
      <a href="/integrations.html">Sources</a>
    </nav>

    <section class="ld-metrics" id="metrics" aria-label="Key metrics"></section>

    <section class="ld-main">
      <div class="ld-card ld-panel">
        <h2>Detections</h2>
        <div class="ld-sub">Items analysed per day, last 12 days</div>
        <div class="ld-chart"><canvas id="trend" role="img" aria-label="Bar chart of detections per day over the last 12 days"></canvas></div>
        <details style="margin-top:10px"><summary class="dim" style="cursor:pointer;font-size:12px">Table view</summary><div id="trend-table" class="table-wrap"></div></details>
      </div>
      <div class="ld-card ld-panel">
        <h2>Recent detections</h2>
        <div class="ld-sub" id="activity-sub">—</div>
        <ul class="ld-activity" id="activity"></ul>
      </div>
    </section>

    <section class="ld-secondary">
      <div class="ld-card ld-panel">
        <div class="row" style="justify-content:space-between"><h2>Top indicators</h2><span class="ld-sub" style="margin:0">7 days, non-legit</span></div>
        <div class="ld-bars hbars" id="indicators"></div>
      </div>
      <div class="ld-card ld-panel">
        <div class="row" style="justify-content:space-between"><h2>Monitoring sources</h2><a class="ld-link" href="/integrations.html">Manage</a></div>
        <div id="sources" style="margin-top:12px"></div>
      </div>
    </section>
  </main>

  <div id="drawer-root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/core.js"></script>
  <script src="js/report.js"></script>
  <script src="js/drawer.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
