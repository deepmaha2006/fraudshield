# nginx TLS reverse proxy for FraudShield (Linux host).
# FraudShield listens on 127.0.0.1:3000; set in its environment:
#   PUBLIC_BASE_URL=https://fraudshield.example.com
#   TRUST_PROXY=loopback
# Certificates: e.g. certbot --nginx -d fraudshield.example.com

limit_req_zone $binary_remote_addr zone=fs_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fs_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name fraudshield.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fraudshield.example.com;

    ssl_certificate     /etc/letsencrypt/live/fraudshield.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fraudshield.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 8m;          # screenshots are capped at 6 MB by the app
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;

    # Defence in depth; the app enforces its own limits.
    location ~ ^/api/(login|register|password/) {
        limit_req zone=fs_auth burst=5 nodelay;
        include /etc/nginx/snippets/fraudshield-proxy.conf;
    }

    # Server-Sent Events: no buffering, long-lived.
    location = /api/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/fraudshield-proxy.conf;
    }

    location /api/ {
        limit_req zone=fs_api burst=40 nodelay;
        proxy_read_timeout 120s;      # live link analysis can take up to ~60 s
        include /etc/nginx/snippets/fraudshield-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/fraudshield-proxy.conf;
    }
}
