version: 2
updates:
  - package-ecosystem: npm
    directory: /fraudshield-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
    # Major versions need a human review of breaking changes and the security regression suite.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /fraudshield-backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android-companion
    schedule:
      interval: monthly
