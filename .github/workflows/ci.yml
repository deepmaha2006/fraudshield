# FraudShield CI — tests, lint, SAST, dependency audit, secret scan, SBOM, container scan.
# Least privilege: read-only token; no deployment credentials exist in this workflow,
# so untrusted pull requests cannot reach production secrets.
#
# Before relying on this in production, pin every third-party action to a full
# commit SHA (e.g. actions/checkout@<40-char-sha> # v4.2.2). Dependabot keeps them updated.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fraudshield-backend

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: fraudshield-backend/package-lock.json
      # Dependency lifecycle scripts are disabled; only the reviewed native build is run.
      - run: npm ci --ignore-scripts
      - run: npm rebuild sqlite3
      - name: Lint (ESLint + eslint-plugin-security)
        run: npx eslint . --max-warnings=0
      - name: Unit, integration and security regression tests
        run: npm test
      - name: Production configuration fails closed without secrets
        run: |
          if NODE_ENV=production DOTENV_PATH=/nonexistent node scripts/check-config.js; then
            echo "::error::production config validation accepted an empty configuration"; exit 1
          fi
      - name: Production configuration accepts a complete secure configuration
        env:
          NODE_ENV: production
          DOTENV_PATH: /nonexistent
          PUBLIC_BASE_URL: https://fraudshield.example.com
          TRUST_PROXY: loopback
          MAIL_TRANSPORT: disabled
        run: DATA_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))") node scripts/check-config.js

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: npm audit (production dependencies, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, report only)
        run: npm audit || true
      - name: Verify registry signatures / provenance
        run: npm audit signatures
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: fraudshield-backend/sbom.cdx.json

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.181.0
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Semgrep (blocking on findings; reviewed exceptions use inline nosemgrep with justification)
        run: >
          semgrep scan --error --metrics=off
          --config p/javascript --config p/nodejsscan --config p/jwt
          --config p/owasp-top-ten --config p/secrets --config p/xss
          --config p/sql-injection --config p/command-injection --config p/insecure-transport
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_x_powered_by
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_check_csp
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_hsts
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_referrer_policy
          --exclude 'fraudshield-backend/tests' --exclude 'backup-v1' --exclude 'android-companion/**/build'
          fraudshield-backend

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan full history, not just the tip
          persist-credentials: false
      - name: Gitleaks (history + working tree)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t fraudshield:ci .
      - name: Image runs as non-root and refuses to start without production config
        run: |
          test "$(docker run --rm --entrypoint id fraudshield:ci -u)" != "0"
          if docker run --rm fraudshield:ci; then echo "::error::container started without required configuration"; exit 1; fi
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fraudshield:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
