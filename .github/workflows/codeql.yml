# GitHub CodeQL (free for public repositories; private repositories need GitHub Advanced Security).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths:
              - fraudshield-backend
            paths-ignore:
              - fraudshield-backend/tests
              - fraudshield-backend/node_modules
      - uses: github/codeql-action/analyze@v3
